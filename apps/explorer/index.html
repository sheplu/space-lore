<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Lore Galaxy Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    canvas { display: block; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; z-index: 1000;
    }
    .spinner { width: 48px; height: 48px; border: 3px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { position: fixed; top: 1rem; left: 1rem; right: 1rem; background: #800; color: #fff; padding: 1rem; border-radius: 4px; z-index: 1000; display: none; }
    #hud {
      position: fixed; left: 1rem; bottom: 1rem; z-index: 500;
      color: #cfe8ff; font-family: ui-monospace, monospace; font-size: 12px;
      background: rgba(0, 10, 25, 0.55); border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 6px; padding: 0.5rem 0.75rem; pointer-events: none;
      display: flex; flex-direction: column; gap: 0.25rem; max-width: 90vw;
    }
    #hud-location { font-weight: 700; color: #fff; }
    #hud-controls { opacity: 0.8; }
    #hud-msg { color: #7df9ff; min-height: 1em; }
  </style>
</head>
<body>
  <div id="errorEl"></div>
  <div id="hud">
    <div id="hud-location">Loading…</div>
    <div id="hud-controls">WASD + QE fly · wheel zoom · click to look · Shift boost · F fly to system · double-click cyan marker · G back to galaxy</div>
    <div id="hud-msg"></div>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading galaxy data...</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
