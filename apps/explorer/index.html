<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Lore Galaxy Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    #app { width: 100vw; height: 100vh; }
    canvas { display: block; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; z-index: 1000;
    }
    .spinner { width: 48px; height: 48px; border: 3px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error { position: fixed; top: 1rem; left: 1rem; right: 1rem; background: #800; color: #fff; padding: 1rem; border-radius: 4px; z-index: 1000; display: none; }
    #hud {
      position: fixed; left: 1rem; bottom: 1rem; z-index: 500;
      color: #cfe8ff; font-family: ui-monospace, monospace; font-size: 12px;
      background: rgba(0, 10, 25, 0.55); border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 6px; padding: 0.5rem 0.75rem; pointer-events: none;
      display: flex; flex-direction: column; gap: 0.25rem; max-width: 90vw;
    }
    #hud-location { font-weight: 700; color: #fff; }
    #hud-controls { opacity: 0.8; }
    #hud-msg { color: #7df9ff; min-height: 1em; }
    #search {
      position: fixed; top: 1rem; right: 1rem; z-index: 600;
      width: min(320px, 80vw);
      font-family: ui-monospace, monospace; font-size: 13px; color: #cfe8ff;
    }
    #search input {
      width: 100%; box-sizing: border-box;
      background: rgba(0, 10, 25, 0.8); color: #fff;
      border: 1px solid rgba(120, 180, 255, 0.35); border-radius: 6px;
      padding: 0.5rem 0.75rem; font: inherit; outline: none;
    }
    #search input:focus { border-color: #7df9ff; }
    #search-results {
      margin-top: 0.35rem; overflow: hidden;
      background: rgba(0, 10, 25, 0.92);
      border: 1px solid rgba(120, 180, 255, 0.25); border-radius: 6px;
      max-height: 50vh; overflow-y: auto;
    }
    .search-item {
      display: flex; gap: 0.5rem; align-items: flex-start;
      padding: 0.45rem 0.6rem; cursor: pointer;
    }
    .search-item.active, .search-item:hover { background: rgba(125, 249, 255, 0.12); }
    .search-kind {
      flex: none; margin-top: 0.1rem; font-size: 10px; text-transform: uppercase;
      border: 1px solid rgba(120, 180, 255, 0.4); border-radius: 4px; padding: 0.05rem 0.3rem;
    }
    .search-kind-planet { color: #7df9ff; }
    .search-kind-nebula { color: #b78cff; }
    .search-kind-cluster { color: #ffd166; }
    .search-kind-snr { color: #ff7a4d; }
    .search-kind-anomaly { color: #ff4dd2; }
    .search-name { color: #fff; }
    .search-detail { opacity: 0.7; font-size: 11px; }
    .search-empty { padding: 0.5rem 0.75rem; opacity: 0.7; }
    #inspect-panel {
      position: fixed; top: 1rem; left: 1rem; z-index: 600;
      width: min(340px, 85vw); max-height: calc(100vh - 2rem); overflow-y: auto;
      font-family: ui-monospace, monospace; font-size: 13px; color: #cfe8ff;
      background: rgba(0, 10, 25, 0.92);
      border: 1px solid rgba(120, 180, 255, 0.3); border-radius: 8px;
      padding: 0.75rem 0.85rem;
    }
    .inspect-head { display: flex; gap: 0.5rem; align-items: baseline; margin-bottom: 0.4rem; }
    .inspect-title { color: #fff; font-weight: 700; font-size: 15px; }
    .inspect-badge {
      flex: none; font-size: 10px; text-transform: uppercase; color: #7df9ff;
      border: 1px solid rgba(125, 249, 255, 0.4); border-radius: 4px; padding: 0.05rem 0.3rem;
    }
    .inspect-desc { line-height: 1.45; margin-bottom: 0.5rem; }
    .inspect-tags { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 0.5rem; }
    .inspect-tag {
      font-size: 11px; opacity: 0.85;
      border: 1px solid rgba(120, 180, 255, 0.3); border-radius: 4px; padding: 0.05rem 0.35rem;
    }
    .inspect-stat {
      display: flex; justify-content: space-between; gap: 0.75rem;
      padding: 0.2rem 0; border-top: 1px solid rgba(120, 180, 255, 0.12);
    }
    .inspect-stat-label { opacity: 0.65; }
    .inspect-stat-value { color: #fff; text-align: right; }
    .inspect-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
    .inspect-actions button {
      flex: 1; font: inherit; cursor: pointer; color: #04121f;
      background: #7df9ff; border: none; border-radius: 6px; padding: 0.45rem;
    }
    .inspect-actions button.inspect-close {
      color: #cfe8ff; background: transparent;
      border: 1px solid rgba(120, 180, 255, 0.35);
    }
    #time-controls {
      position: fixed; right: 1rem; bottom: 1rem; z-index: 600;
      display: flex; gap: 0.4rem; align-items: center;
      font-family: ui-monospace, monospace; font-size: 12px; color: #cfe8ff;
      background: rgba(0, 10, 25, 0.55); border: 1px solid rgba(120, 180, 255, 0.25);
      border-radius: 6px; padding: 0.4rem 0.5rem;
    }
    #time-controls button {
      font: inherit; cursor: pointer; color: #04121f;
      background: #7df9ff; border: none; border-radius: 4px; padding: 0.25rem 0.5rem;
      min-width: 3.2rem;
    }
    #time-controls button.time-speed { background: transparent; color: #cfe8ff; border: 1px solid rgba(120, 180, 255, 0.35); }
    .time-readout { opacity: 0.8; min-width: 3.5rem; text-align: right; }
  </style>
</head>
<body>
  <div id="errorEl"></div>
  <div id="hud">
    <div id="hud-location">Loading…</div>
    <div id="hud-controls">WASD + QE fly · scroll to dive in / out · Shift boost · F system · C quadrant · P planet · / search · Space pause · click to inspect · double-click marker/planet · Esc step back · G galaxy</div>
    <div id="hud-msg"></div>
  </div>
  <div id="loading">
    <div class="spinner"></div>
    <p>Loading galaxy data...</p>
  </div>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
